      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "2cab78099bd636427406100deebd3495", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9b165af562983bd9f3ff0338a6845b5a", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "950ab0254c9de140014c864e9dc1de1c", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dc0c78fd4ed0158182361350652246db", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"week-1-python-and-data-foundations\"\u003EWeek 1: Python and data foundations\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EA full week of self-study, mapped to \u003Cstrong\u003EPython Programming for AI Engineering\u003C/strong\u003E. Estimated \u003Cstrong\u003E12 active hours\u003C/strong\u003E, not an official contact-hour claim.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIndependent reconstruction, not NUS-issued teaching material.\u003C/strong\u003E Published objectives are the anchor. Exercises, datasets and rubric are original.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EUse Python collections, functions, conditionals and files\u003C/li\u003E\n\u003Cli\u003EClean and aggregate a table with NumPy and pandas\u003C/li\u003E\n\u003Cli\u003EValidate data instead of silently filling bad values\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.comp.nus.edu.sg/executive-education/course/sctp-python-programming-for-ai-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EOfficial objectives\u003C/a\u003E | \u003Ca href=\"https://github.com/azjhf-dev/nus-aie-week-01-python\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERepository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBoundary:\u003C/strong\u003E No exact SCTP Python assignments are public in the inspected evidence. The synthetic dataset and all lessons are original.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "94fc1dd852b7d4639a030311daddb92c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"plan-your-week\"\u003EPlan your week\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDay 1: expressions, types, collections and functions (2h)\u003C/li\u003E\n\u003Cli\u003EDay 2: file I/O, CSV and validation (2h)\u003C/li\u003E\n\u003Cli\u003EDay 3: NumPy arrays and vector operations (2h)\u003C/li\u003E\n\u003Cli\u003EDay 4: pandas cleaning and group summaries (2h)\u003C/li\u003E\n\u003Cli\u003EDay 5: build, test and explain the audit (4h)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EStart each lab by predicting the effect of a control. Change one variable, record the observation, then explain why. All default experiments need no key, no paid service and no private data. The hosted WASM viewer needs an internet connection to fetch its runtime and packages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7dcf544d6e13bfb4f59f9c13e86467e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='03869046-b046-7ab2-bc4f-5d9e7fc3924d'\u003E\u003Cmarimo-checkbox data-initial-value='true' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003ePlay conceptual motion graphic\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-disabled='false'\u003E\u003C/marimo-checkbox\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "a0fba41642db2f85093aff display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EValidation:\u003C/strong\u003E {'all hours present': True, 'scores in 0..100': True, 'no duplicate columns': True}\u003C/span\u003E\u003C/span\u003E\u003Cpre class='text-xs'\u003Ehours,practice,score,group\n8.450747927979016,8,58.9401622834038,B\n1.6097309116910696,9,38.844090564627095,A\n5.577445473656921,5,56.678771679647525,B\n3.6807994166427127,4,62.20837373220908,A\n2.1494196356176842,0,37.6761648097073,B\n\u003C/pre\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "1301cc0f55bf7498140758883d560fd1", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"build-something-then-defend-it\"\u003EBuild something, then defend it\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThis week's deliverable:\u003C/strong\u003E A reproducible synthetic learning-activity data audit.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECreate a dated lab log with: question, prediction, changed input, observed output, explanation, failure case and next test. Keep the final evaluation separate from the data used for choosing settings.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d78c0dd29970e0e03a65f7f0ae4693af", "console": [], "id": "DnEU", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhy is zero-filling missing hours potentially misleading?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhat should be fitted only on training data in later modules?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eBuild task\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIt changes the mean and encodes missingness as a real zero. Compare missing-data assumptions and document the policy.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EImputation statistics, scalers, feature selection and any data-dependent transforms.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAdd a reusable validation function; test an empty file, duplicate columns, out-of-range scores and a fully missing numeric column.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "edb8cca576e759616b9f539cb8aaddc3", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"evidence-and-next-depth\"\u003EEvidence and next depth\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThese are \u003Cstrong\u003Eother NUS-ISS courses and projects\u003C/strong
